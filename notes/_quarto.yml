project:
  type: book
  output-dir: ../output/book

book:
  title: "Understanding Intelligence Through Robotics"
  subtitle: "From Geometry and Control to Learning, World Models, and Safe Autonomy"
  author: "Chien-Hsiang Yeh"
  date: today
  date-format: "D MMMM YYYY"

  downloads:
    - pdf

  navbar:
    search: true
    respect-user-color-scheme: true

  chapters:
    - index.qmd
    - notation.qmd
    - part: '[Part I:]{.content-visible when-format="html"} Motion, Mechanics, and Control'
      chapters:
        - part_01_motion_mechanics_control/01_linear_algebra_foundations.qmd
        - part_01_motion_mechanics_control/02_geometry_and_coordinate_frames.qmd
        - part_01_motion_mechanics_control/03_kinematics_and_numerical_integration.qmd
        - part_01_motion_mechanics_control/04_kinematics_and_numerical_integration_implementation.qmd
        - part_01_motion_mechanics_control/05_ros2_packages_and_development_workflow.qmd
        - part_01_motion_mechanics_control/06_planar_rigid_body_motion_se2_and_twists.qmd
        - part_01_motion_mechanics_control/07_degrees_of_freedom_and_spatial_motion_so3_se3.qmd
        - part_01_motion_mechanics_control/08_screw_motion_se3_exponential_and_spatial_integration.qmd
        - part_01_motion_mechanics_control/09_spatial_geometry_kernel_implementation.qmd
        - part_01_motion_mechanics_control/10_general_robot_kinematics_and_jacobians.qmd
    - part: '[Part II:]{.content-visible when-format="html"} Probability and Estimation'
      chapters:
        - part_02_probability_estimation/finite_markov_chains.qmd
    - part: '[Part V:]{.content-visible when-format="html"} Optimisation, Planning, and Decisions'
      chapters:
        - part_05_optimisation_planning_decisions/finite_markov_decision_processes.qmd


lang: en-AU

format:
  html:
    theme:
      light: yeti
      dark: solar
    syntax-highlighting:
      light: arrow-light
      dark: arrow-dark
    css: styles.css
    include-after-body: toc-toggle.html
    mainfont: "Roboto"
    monofont: "Roboto Mono"
    toc: true
    code-copy: true
  pdf:
    documentclass: scrreprt
    classoption:
      - twoside
    pdf-engine: xelatex
    fontsize: 12pt
    mainfont: "Palatino Linotype"
    mathfont: "NewComputerModern Math"  # "TeX Gyre Pagella Math"
    monofont: "Roboto Mono"
    monofontoptions:
      - Scale=0.80
    syntax-highlighting: arrow-light
    code-block-bg: "#F1F3F5"
    code-block-border-left: "#6272A4"
    include-in-header:
      text: |
        \usepackage{pmboxdraw}

        % Title-page typography
        \setkomafont{author}{\normalsize\rmfamily}

        % Inline code color
        \usepackage{xcolor}
        \definecolor{InlineCodeColour}{HTML}{1F4E79}

        \let\OriginalTexttt\texttt
        \DeclareRobustCommand{\StyledTexttt}[1]{%
          \textcolor{InlineCodeColour}{\OriginalTexttt{#1}}%
        }
        \AtBeginDocument{\let\texttt\StyledTexttt}

        % Keep Unicode-math symbols in headings safe for PDF bookmarks.
        \AtBeginDocument{%
          \pdfstringdefDisableCommands{%
            \def\texttt#1{#1}%
            \def\boldsymbol#1{#1}%
            \def\mathbf#1{#1}%
            \def\eta{eta}%
            \def\Delta{Delta}%
          }%
        }

        \setkomafont{disposition}{\rmfamily\bfseries}

        % Roman-numbered page numbering
        \AtBeginDocument{\pagenumbering{roman}}

        % Headers
        \usepackage[automark,headsepline]{scrlayer-scrpage}
        \clearpairofpagestyles

        \automark[section]{chapter}

        % Left/even page: chapter
        \lehead{\leftmark}

        % Right/odd page: section
        \rohead{\rightmark}

        % Page number on every page, including chapter-opening pages
        \cfoot*{\pagemark}

        \setkomafont{pageheadfoot}{\small\sffamily}

        % Add a little vertical space to table rows.
        \renewcommand{\arraystretch}{1.20}


    toc: true
    geometry:
      - top=22mm
      - bottom=25mm
      - left=25mm
      - right=25mm

number-sections: true
number-depth: 3
