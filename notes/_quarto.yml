project:
  type: book
  output-dir: ../output/book

book:
  title: "Understanding Intelligence Through Robotics"
  subtitle: "From Geometry and Control to Learning, World Models, and Safe Autonomy"
  author: "Chien-Hsiang Yeh"
  date: today
  date-format: "D MMMM YYYY"

  downloads:
    - pdf

  navbar:
    search: true
    respect-user-color-scheme: true
  chapters:
    - index.qmd
    - notation.qmd
    - part: '[Part I:]{.content-visible when-format="html"} Motion, Mechanics, and Control'
      chapters:
        - 01_linear_algebra_foundations.qmd
        - 02_geometry_and_coordinate_frames.qmd
        - 03_kinematics_and_numerical_integration.qmd
        - 04_kinematics_and_numerical_integration_implementation.qmd
        - 05_ros2_packages_and_development_workflow.qmd
        - 06_planar_rigid_body_motion_se2_and_twists.qmd
        - 07_degrees_of_freedom_and_spatial_motion_so3_se3.qmd
        - 08_screw_motion_se3_exponential_and_spatial_integration.qmd
        - 09_spatial_geometry_kernel_implementation.qmd
        - 10_general_robot_kinematics_and_jacobians.qmd
        

lang: en-AU

format:
  html:
    theme:
      light: yeti
      dark: solar
    css: styles.css
    mainfont: "Roboto"
    toc: true
    code-copy: true
  pdf:
    documentclass: scrreprt
    classoption:
    - twoside
    pdf-engine: pdflatex
    fontsize: 12pt
    fontenc: OT1
    fontfamily: fix-cm
    include-in-header:
      text: |
        \usepackage{pmboxdraw}
        \usepackage[scaled=0.90]{roboto-mono}

        % Roman-numbered page numbering
        \AtBeginDocument{\pagenumbering{roman}}

        % Headers
        \usepackage[automark,headsepline]{scrlayer-scrpage}
        \clearpairofpagestyles

        \automark[section]{chapter}

        % Left/even page: chapter
        \lehead{\leftmark}

        % Right/odd page: section
        \rohead{\rightmark}

        % Page number on every page, including chapter-opening pages
        \cfoot*{\pagemark}

        \setkomafont{pageheadfoot}{\small\sffamily}
    toc: true
    geometry:
      - top=22mm
      - bottom=25mm
      - left=25mm
      - right=25mm

number-sections: true
number-depth: 3
